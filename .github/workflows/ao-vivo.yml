name: Apuração ao vivo 2026 (2º turno)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ao-vivo-2t
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Restaurar estado da coleta (seções já baixadas e ETags)
        uses: actions/cache@v4
        with:
          path: ao_vivo_estado
          key: ao-vivo-2t-${{ github.run_id }}
          restore-keys: ao-vivo-2t-
      - name: Coletar um ciclo (disparado a cada 2 min pelo Agendador de Tarefas)
        env:
          AO_VIVO_WORKERS: '32'
        run: python scripts/ao_vivo.py --turno 2 --uma-vez --publicar --publicar-intervalo 120 --ate 2026-10-26T03:00:00Z

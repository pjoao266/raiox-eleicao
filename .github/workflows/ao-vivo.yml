name: Apuração ao vivo 2026 (2º turno)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ao-vivo-2t
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Restaurar estado da coleta (seções já baixadas e ETags)
        uses: actions/cache@v4
        with:
          path: ao_vivo_estado
          key: ao-vivo-2t-${{ github.run_id }}
          restore-keys: ao-vivo-2t-
      - name: Coletar a cada 2 min até meia-noite de Brasília (03:00 UTC de 26/10)
        env:
          AO_VIVO_WORKERS: '32'
        run: python scripts/ao_vivo.py --turno 2 --dura 270 --intervalo 120 --publicar --publicar-intervalo 600 --ate 2026-10-26T03:00:00Z
      - name: Disparar publicação do site quando houve mudança
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ao_vivo_estado/publicou.flag ]; then
            gh workflow run "Publicar Raio-X Eleitoral" --ref main
          fi

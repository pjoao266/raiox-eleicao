name: Salvar presidência 2022
on:
  push:
    branches: [main]
    paths:
      - scripts/coletar-presidencia-2022.py
      - .github/workflows/collect-2022.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coleta-presidencia-2022
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/coletar-presidencia-2022.py
      - name: Salvar dados oficiais de 2022
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/2022/*.csv.gz data/2022/manifesto.json
          if ! git diff --cached --quiet; then
            git commit -m 'Salva presidência 2022: municípios, zonas e apuração dos dois turnos'
            git push
          fi
